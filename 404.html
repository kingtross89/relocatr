<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Relocatr — Page Redirect</title>
    <script type="text/javascript">
      // SPA routing script for GitHub Pages
      var l = window.location;
      var path = l.pathname;
      var routesIndex = path.indexOf('/routes/');
      if (routesIndex >= 0) {
        var routePath = path.substring(routesIndex + 8).replace(/\/+$/, ''); // e.g. "es-to-us"
        var basePath = l.pathname.substring(0, routesIndex);
        var redirectUrl = l.protocol + '//' + l.host + basePath + '/index.html?redirect_route=' + encodeURIComponent(routePath);
        l.replace(redirectUrl);
      } else {
        // Default fallback: redirect to homepage
        var basePath = l.pathname;
        if (basePath.indexOf('/routes/') < 0) {
          // Find root directory segment if nested
          var lastSlash = basePath.lastIndexOf('/');
          if (lastSlash >= 0) {
            basePath = basePath.substring(0, lastSlash);
          }
        }
        l.replace(l.protocol + '//' + l.host + basePath + '/index.html');
      }
    </script>
  </head>
  <body>
    <p>Redirecting to Relocatr...</p>
  </body>
</html>
